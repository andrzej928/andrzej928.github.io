<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>xN0rth</title>
  <link rel="icon" href="assets/avatar.webp">
  <meta name="theme-color" content="#c4161c">
  <meta name="description" content="xN0rth — życie na edicie. Wszystkie linki: Kick, YouTube, Instagram, X, TikTok.">
  <meta property="og:site_name" content="xN0rth">
  <meta property="og:title" content="xN0rth - Wszystkie najważniejsze linki">
  <meta property="og:description" content="xN0rth — życie na edicie. Wszystkie linki: Kick, YouTube, Instagram, X, TikTok.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/banner.jpg">
  <meta property="og:locale" content="pl_PL">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@xN0rthh">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="background-container">
    <img draggable="false" src="assets/banner.jpg" class="background-image" alt="">
    <div class="background-pattern"></div>
  </div>

  <div class="content-container">
    <main class="content">
      <div class="logo-container">
        <img draggable="false" src="assets/avatar.webp" class="logo" alt="xN0rth">
      </div>
      <h1 class="name">xN0rth</h1>
      <div class="description"></div>

      <div class="links"></div>
    </main>

    <footer class="footer">
      <div class="footer-content">
        <img draggable="false" src="assets/avatar.webp" height="30" width="30" alt="">
        <p>© <span id="year"></span> by <span id="footer-name">xN0rth</span></p>
      </div>
      <div class="footer-clock"><p><span id="time"></span></p></div>
    </footer>
  </div>

  <script src="js/icons.js"></script>
  <script>
    // Block right-click on background
    document.querySelector(".background-image").addEventListener("contextmenu", e => e.preventDefault())

    // Current year
    document.getElementById("year").textContent = new Date().getFullYear()

    // Clock
    function updateTime() {
      const now = new Date()
      const hours = String(now.getHours()).padStart(2, "0")
      const minutes = String(now.getMinutes()).padStart(2, "0")
      document.getElementById("time").textContent = `${hours}:${minutes}`
    }
    updateTime()
    setInterval(updateTime, 1000)

    // ---------- Links rendered from data/config.json ----------
    function safeUrl(u) {
      try {
        const url = new URL(u, location.href)
        return ["http:", "https:", "mailto:"].includes(url.protocol) ? url.href : "#"
      } catch { return "#" }
    }

    function el(tag, cls, text) {
      const e = document.createElement(tag)
      if (cls) e.className = cls
      if (text != null) e.textContent = text
      return e
    }

    // Exposed so admin.html can render a live preview
    window.renderConfig = function (cfg) {
      const profile = cfg.profile || {}
      if (profile.name) {
        document.querySelector(".name").textContent = profile.name
        document.getElementById("footer-name").textContent = profile.name
        document.title = profile.name
      }

      const desc = document.querySelector(".description")
      desc.replaceChildren(...(profile.description || []).map(line => el("p", null, line)))

      const links = document.querySelector(".links")
      links.replaceChildren(...(cfg.links || []).filter(l => l.visible !== false).map(l => {
        const a = el("a", "link")
        a.href = safeUrl(l.url)
        a.target = "_blank"
        a.rel = "noopener noreferrer"
        if (l.color) {
          a.classList.add("has-accent")
          a.style.setProperty("--accent", l.color)
        }
        const icon = el("div", "icon")
        icon.innerHTML = iconFor(l)
        const info = el("div", "info")
        info.append(el("div", "title", l.title || ""))
        if (l.subtitle) info.append(el("div", "url", l.subtitle))
        a.append(icon, info)
        return a
      }))
    }

    // In preview mode admin.html pushes the config itself
    if (!new URLSearchParams(location.search).has("preview")) {
      fetch("data/config.json?v=" + Date.now(), { cache: "no-store" })
        .then(r => r.ok ? r.json() : Promise.reject(r.status))
        .then(renderConfig)
        .catch(err => {
          console.error("Nie udało się wczytać data/config.json", err)
          document.querySelector(".links").replaceChildren(el("p", "description", "Nie udało się wczytać linków."))
        })
    }
  </script>
</body>
</html>
